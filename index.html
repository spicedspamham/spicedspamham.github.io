<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Shrinkage</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
background:#000;
padding:12px;
text-align:center;
font-size:22px;
}

#container{
max-width:1100px;
margin:auto;
padding:10px;
}

.row{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.board{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.hand{
display:flex;
overflow-x:auto;
gap:8px;
padding:6px;
}

.card{
width:140px;
border-radius:10px;
background:#e6b98a;
color:black;
border:3px solid black;
display:flex;
flex-direction:column;
}

.cardTop{
display:flex;
justify-content:space-between;
padding:4px;
background:#e6b98a;
border-bottom:2px solid black;
font-weight:bold;
}

.cardArt{
height:140px;
background-size:contain;
background-position:center;
background-repeat:no-repeat;
}

.cardText{
padding:6px;
font-size:12px;
min-height:60px;
}

.cardBottom{
display:flex;
justify-content:space-between;
border-top:2px solid black;
padding:4px;
font-size:11px;
}

button{
padding:10px;
border:none;
border-radius:6px;
background:#444;
color:white;
}

#log{
background:#000;
padding:6px;
height:160px;
overflow:auto;
font-size:12px;
}

footer{
text-align:center;
font-size:13px;
padding:10px;
color:#bbb;
}

</style>

</head>

<body>

<header>
Shrinkage
</header>

<div id="container">

<div id="status"></div>

<div>
<button onclick="nextPhase()">Next Phase</button>
<button onclick="attack()">Attack</button>
<button onclick="toggleCompetitive()">Competitive Mode</button>
<button onclick="saveGame()">Save Game</button>
<button onclick="loadGame()">Load Game</button>
</div>

<h3>AI Board</h3>
<div id="aiBoard" class="board"></div>

<h3>Your Board</h3>
<div id="playerBoard" class="board"></div>

<h3>Your Hand</h3>
<div id="hand" class="hand"></div>

<h3>Game Log</h3>
<div id="log"></div>

</div>

<footer>
Shrinkage by Joseph DeSantis  
Support development: Venmo @Joseph-DeSantis-43
</footer>

<script>

/* ======================
LOGO
====================== */

const LOGO = "logo.png"

/* ======================
CARD DATABASE
====================== */

const CARDS=[

{name:"Vigilant Keeper",type:"Soldier",cost:0,power:0,stars:1,
text:"Counter opponent card by shrinking X where X = cost. Forbid this soldier."},

{name:"Scout",type:"Soldier",cost:2,power:1,stars:1,text:"Shrink 1 on play"},

{name:"Raider",type:"Soldier",cost:3,power:2,stars:1},

{name:"Knight",type:"Soldier",cost:4,power:4,stars:2},

{name:"Titan",type:"Soldier",cost:7,power:7,stars:3},

{name:"Strike",type:"Instant",cost:1,text:"Destroy a soldier"},

{name:"Collapse",type:"Instant",cost:3,text:"Destroy a soldier"},

{name:"Bomb",type:"Instant",cost:2,text:"Shrink 2"}

]

/* ======================
GAME STATE
====================== */

let game={

phase:"Draw",

competitive:false,

player:{
deck:[],
hand:[],
board:[],
spoils:[],
resources:0,
timer:180
},

ai:{
deck:[],
hand:[],
board:[],
spoils:[],
resources:0,
timer:180
},

stack:[]

}

/* ======================
LOG
====================== */

function log(t){

let el=document.getElementById("log")
el.innerHTML+=t+"<br>"
el.scrollTop=el.scrollHeight

}

/* ======================
UTIL
====================== */

function roll(){

return Math.floor(Math.random()*6)+1

}

function shrink(p,n){

for(let i=0;i<n;i++){

if(p.deck.length==0){

alert("Deck empty")
location.reload()

}

p.spoils.push(p.deck.pop())

}

}

/* ======================
TURN PHASES
====================== */

function nextPhase(){

if(game.phase=="Draw"){

draw(game.player,2)

game.phase="Resource"

}

else if(game.phase=="Resource"){

let r=6+roll()

game.player.resources+=r

log("Player gains "+r+" resources")

game.phase="Main"

}

else if(game.phase=="Main"){

resolveStack()

game.phase="Combat"

}

else if(game.phase=="Combat"){

endTurn()

}

render()

}

/* ======================
STACK
====================== */

function playCard(i){

let name=game.player.hand[i]

let card=CARDS.find(c=>c.name==name)

if(game.player.resources<card.cost) return

game.player.resources-=card.cost

game.player.hand.splice(i,1)

game.stack.push({player:"player",card:card})

log("Player plays "+card.name)

render()

}

function resolveStack(){

while(game.stack.length>0){

let action=game.stack.pop()

let card=action.card

log("Resolving "+card.name)

if(card.text?.includes("Shrink")){

shrink(game.ai,1)

}

}

}

/* ======================
COMBAT
====================== */

function attack(){

if(game.player.board.length==0) return

let atk=game.player.board.shift()

let def=game.ai.board.shift()

if(def){

log("Clash")

game.player.spoils.push(atk)
game.ai.spoils.push(def)

}else{

let p=CARDS.find(c=>c.name==atk).power

shrink(game.ai,p)

}

render()

}

/* ======================
END TURN
====================== */

function endTurn(){

if(game.player.resources>6)
game.player.resources=6

if(game.competitive){

shrink(game.player,5)

log("Competitive shrink 5")

}

aiTurn()

game.phase="Draw"

}

/* ======================
AI
====================== */

function aiTurn(){

draw(game.ai,2)

game.ai.resources+=6+roll()

let playable=game.ai.hand.find(c=>{
let card=CARDS.find(x=>x.name==c)
return card.cost<=game.ai.resources
})

if(playable){

let card=CARDS.find(x=>x.name==playable)

game.ai.resources-=card.cost

game.ai.board.push(playable)

log("AI plays "+playable)

}

}

/* ======================
DRAW
====================== */

function draw(p,n){

for(let i=0;i<n;i++){

p.hand.push(p.deck.pop())

}

}

/* ======================
RENDER
====================== */

function render(){

document.getElementById("status").innerHTML=
"Phase: "+game.phase+
" | Resources: "+game.player.resources+
" | Deck: "+game.player.deck.length

let h=""

game.player.hand.forEach((c,i)=>{

let card=CARDS.find(x=>x.name==c)

h+=cardHTML(card,i)

})

document.getElementById("hand").innerHTML=h

}

/* ======================
CARD UI
====================== */

function cardHTML(card,i){

return `
<div class="card">

<div class="cardTop">
<span>${card.name}</span>
<span>${card.cost}</span>
</div>

<div class="cardArt" style="background-image:url('${LOGO}')"></div>

<div class="cardText">
${card.text||""}
</div>

<div class="cardBottom">
<span>Shrinkage</span>
<span>${card.stars||1}</span>
</div>

<button onclick="playCard(${i})">Play</button>

</div>
`

}

/* ======================
SAVE
====================== */

function saveGame(){

localStorage.setItem("shrinkageSave",JSON.stringify(game))

log("Game saved")

}

function loadGame(){

let g=localStorage.getItem("shrinkageSave")

if(g){

game=JSON.parse(g)

render()

}

}

/* ======================
COMP MODE
====================== */

function toggleCompetitive(){

game.competitive=!game.competitive

log("Competitive mode "+game.competitive)

}

/* ======================
START
====================== */

function start(){

game.player.deck=["Scout","Scout","Scout","Raider","Knight","Titan","Bomb","Strike"]
game.ai.deck=[...game.player.deck]

draw(game.player,3)
draw(game.ai,3)

render()

}

start()

</script>

</body>
</html>
