<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shrinkage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

header{
background:#000;
padding:12px;
text-align:center;
font-size:22px;
}

#main{
max-width:900px;
margin:auto;
padding:10px;
}

.section{
margin-bottom:14px;
}

.board{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.hand{
display:flex;
overflow-x:auto;
gap:8px;
}

.card{
background:#222;
border:1px solid #666;
border-radius:8px;
padding:6px;
width:110px;
font-size:12px;
flex-shrink:0;
}

.card button{
width:100%;
margin-top:4px;
}

button{
padding:10px;
border:none;
border-radius:6px;
background:#444;
color:white;
}

button:active{
background:#666;
}

#controls{
display:flex;
flex-wrap:wrap;
gap:6px;
}

.small{
font-size:12px;
color:#aaa;
}

#deckBuilder{
display:none;
}

.cardRow{
display:flex;
justify-content:space-between;
padding:4px;
border-bottom:1px solid #333;
}

</style>
</head>

<body>

<header>Shrinkage</header>

<div id="main">

<div id="game">

<div class="section" id="status"></div>

<div class="section">
<b>AI Board</b>
<div id="aiBoard" class="board"></div>
</div>

<div class="section">
<b>Your Board</b>
<div id="playerBoard" class="board"></div>
</div>

<div class="section">
<b>Your Hand</b>
<div id="hand" class="hand"></div>
</div>

<div class="section" id="controls">

<button onclick="nextPhase()">Next Phase</button>
<button onclick="attack()">Attack</button>
<button onclick="openDeckBuilder()">Deck Builder</button>
<button onclick="showRules()">Rules</button>

</div>

<div class="section small">
Deck: <span id="deckCount"></span> |
Spoils: <span id="spoilsCount"></span>
</div>

</div>

<div id="deckBuilder">

<h2>Deck Builder</h2>

Deck Size: <span id="deckSize"></span>/50

<div id="builderList"></div>

<button onclick="saveDeck()">Save Deck</button>
<button onclick="closeDeckBuilder()">Back</button>

</div>

</div>

<script>

/* =============================
CARD LIBRARY (60+)
============================= */

const CARDS=[

{name:"Scout",stars:1,type:"Soldier",cost:2,power:1,shrink:1},
{name:"Runner",stars:1,type:"Soldier",cost:1,power:1},
{name:"Raider",stars:1,type:"Soldier",cost:3,power:2},
{name:"Guard",stars:1,type:"Soldier",cost:2,power:2},
{name:"Slinger",stars:1,type:"Soldier",cost:2,power:1,shrink:1},
{name:"Ambusher",stars:1,type:"Soldier",cost:2,power:2},
{name:"Archer",stars:1,type:"Soldier",cost:3,power:2},
{name:"Watcher",stars:1,type:"Soldier",cost:2,power:1,shrink:1},
{name:"Stalker",stars:1,type:"Soldier",cost:2,power:2},
{name:"Spearman",stars:1,type:"Soldier",cost:3,power:2},

{name:"Knight",stars:2,type:"Soldier",cost:4,power:4},
{name:"Guardian",stars:2,type:"Soldier",cost:4,power:3},
{name:"Hunter",stars:2,type:"Soldier",cost:4,power:3},
{name:"Breaker",stars:2,type:"Soldier",cost:5,power:5},
{name:"Captain",stars:2,type:"Soldier",cost:5,power:4},
{name:"Sieger",stars:2,type:"Soldier",cost:5,power:4,shrink:2},
{name:"Champion",stars:2,type:"Soldier",cost:5,power:4},
{name:"Defender",stars:2,type:"Soldier",cost:4,power:3},
{name:"Ranger",stars:2,type:"Soldier",cost:4,power:3},
{name:"Crusher",stars:2,type:"Soldier",cost:5,power:5},

{name:"Titan",stars:3,type:"Soldier",cost:7,power:7},
{name:"Colossus",stars:3,type:"Soldier",cost:6,power:6},
{name:"Behemoth",stars:3,type:"Soldier",cost:7,power:8},
{name:"Juggernaut",stars:3,type:"Soldier",cost:6,power:7},
{name:"Dreadlord",stars:3,type:"Soldier",cost:7,power:6,shrink:3},

{name:"Strike",stars:1,type:"Instant",cost:1,destroy:1},
{name:"Burst",stars:1,type:"Instant",cost:2,shrink:1},
{name:"Bomb",stars:1,type:"Instant",cost:2,shrink:2},
{name:"Edge",stars:1,type:"Instant",cost:2,shrink:1},

{name:"Collapse",stars:2,type:"Instant",cost:3,destroy:1},
{name:"Storm",stars:2,type:"Instant",cost:3,shrink:2},
{name:"Drain",stars:2,type:"Instant",cost:3,shrink:3},
{name:"Blast",stars:2,type:"Instant",cost:4,destroy:1},

{name:"Rift",stars:3,type:"Instant",cost:5,shrink:5},
{name:"TimeCut",stars:3,type:"Instant",cost:4,shrink:4}

]

/* =============================
GAME STATE
============================= */

let player={deck:[],hand:[],board:[],spoils:[],resources:0}
let ai={deck:[],hand:[],board:[],spoils:[],resources:0}

let phase="Draw"

let playerDeck=[]

/* =============================
UTILITY
============================= */

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
;[a[i],a[j]]=[a[j],a[i]]
}
}

function draw(p,n){

for(let i=0;i<n;i++){

if(p.deck.length===0){
alert("Deck empty! Game Over")
location.reload()
}

p.hand.push(p.deck.pop())

}

}

function shrink(p,n){

for(let i=0;i<n;i++){

if(p.deck.length===0){
alert("Deck empty!")
location.reload()
}

p.spoils.push(p.deck.pop())

}

}

/* =============================
START GAME
============================= */

function start(){

let saved=localStorage.getItem("deck")

if(saved){
playerDeck=JSON.parse(saved)
}else{
playerDeck=defaultDeck()
}

player.deck=[...playerDeck]
ai.deck=defaultDeck()

shuffle(player.deck)
shuffle(ai.deck)

draw(player,3)
draw(ai,3)

render()

}

function defaultDeck(){

let d=[]
for(let i=0;i<25;i++) d.push("Scout")
for(let i=0;i<25;i++) d.push("Raider")

return d

}

/* =============================
PHASES
============================= */

function nextPhase(){

if(phase==="Draw"){
draw(player,2)
phase="Resource"
}

else if(phase==="Resource"){
player.resources+=6+Math.floor(Math.random()*6)+1
phase="Main"
}

else if(phase==="Main"){
phase="Combat"
}

else if(phase==="Combat"){
aiTurn()
phase="Draw"
}

render()

}

/* =============================
PLAY CARD
============================= */

function playCard(i){

let name=player.hand[i]
let card=CARDS.find(c=>c.name===name)

if(player.resources<card.cost)return

player.resources-=card.cost
player.hand.splice(i,1)

if(card.type==="Soldier"){

player.board.push(name)

if(card.shrink) shrink(ai,card.shrink)

}else{

if(card.shrink) shrink(ai,card.shrink)

if(card.destroy && ai.board.length)
ai.spoils.push(ai.board.shift())

}

render()

}

/* =============================
COMBAT
============================= */

function attack(){

if(player.board.length===0)return

let atk=CARDS.find(c=>c.name===player.board[0])
let def=ai.board.length?CARDS.find(c=>c.name===ai.board[0]):null

if(def){

player.spoils.push(player.board.shift())
ai.spoils.push(ai.board.shift())

if(atk.power>def.power)
shrink(ai,atk.power-def.power)

if(def.power>atk.power)
shrink(player,def.power-atk.power)

}else{

shrink(ai,atk.power)

}

render()

}

/* =============================
AI
============================= */

function aiTurn(){

draw(ai,2)

ai.resources+=6+Math.floor(Math.random()*6)+1

for(let i=0;i<ai.hand.length;i++){

let name=ai.hand[i]
let card=CARDS.find(c=>c.name===name)

if(card.cost<=ai.resources){

ai.resources-=card.cost
ai.hand.splice(i,1)

if(card.type==="Soldier")
ai.board.push(name)

break

}

}

if(ai.board.length){

let atk=CARDS.find(c=>c.name===ai.board[0])
let def=player.board.length?CARDS.find(c=>c.name===player.board[0]):null

if(def){

ai.spoils.push(ai.board.shift())
player.spoils.push(player.board.shift())

if(atk.power>def.power)
shrink(player,atk.power-def.power)

}else{

shrink(player,atk.power)

}

}

}

/* =============================
RENDER
============================= */

function render(){

document.getElementById("status").innerHTML=
"Phase: "+phase+" | Resources: "+player.resources

document.getElementById("deckCount").innerText=player.deck.length
document.getElementById("spoilsCount").innerText=player.spoils.length

let handHTML=""

player.hand.forEach((c,i)=>{

let card=CARDS.find(x=>x.name===c)

handHTML+=`
<div class="card">
<b>${card.name}</b><br>
Cost:${card.cost}<br>
Power:${card.power||"-"}<br>
<button onclick="playCard(${i})">Play</button>
</div>
`

})

document.getElementById("hand").innerHTML=handHTML

let pb=""
player.board.forEach(c=>{
let card=CARDS.find(x=>x.name===c)
pb+=`<div class="card">${card.name}<br>${card.power}</div>`
})

document.getElementById("playerBoard").innerHTML=pb

let ab=""
ai.board.forEach(c=>{
let card=CARDS.find(x=>x.name===c)
ab+=`<div class="card">${card.name}<br>${card.power}</div>`
})

document.getElementById("aiBoard").innerHTML=ab

}

/* =============================
DECK BUILDER
============================= */

function openDeckBuilder(){

document.getElementById("game").style.display="none"
document.getElementById("deckBuilder").style.display="block"

renderBuilder()

}

function closeDeckBuilder(){

document.getElementById("game").style.display="block"
document.getElementById("deckBuilder").style.display="none"

}

function renderBuilder(){

let html=""

CARDS.forEach(c=>{

html+=`
<div class="cardRow">
${c.name} ⭐${c.stars}
<button onclick="addCard('${c.name}')">Add</button>
</div>
`

})

document.getElementById("builderList").innerHTML=html
document.getElementById("deckSize").innerText=playerDeck.length

}

function addCard(name){

if(playerDeck.length>=50){
alert("Deck full")
return
}

playerDeck.push(name)
renderBuilder()

}

function saveDeck(){

if(playerDeck.length!==50){
alert("Deck must be 50 cards")
return
}

localStorage.setItem("deck",JSON.stringify(playerDeck))

alert("Deck Saved")

}

/* =============================
RULES
============================= */

function showRules(){

alert(`Shrinkage Rules

Goal: Opponent deck reaches 0.

Deck Size: 50

Limits
1★ = 5 copies
2★ = 3 copies
3★ = 1 copy

Star limits
3★ max 5
2★ max 15

Turn Phases
Draw
Resource
Main
Combat

Shrink = move cards from deck to spoils.`)

}

start()

</script>

</body>
</html>
